<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fim de Jogo - Fit Memory Game</title>
    <script src="../assets/css/cdn/tailwindcss/3.4.17.js"></script>
    <link rel="stylesheet" href="../assets/css/background.css"> </head>
<body class="background flex flex-col min-h-screen">

    <div id="header-placeholder"></div>

    <main class="flex-grow container mx-auto p-4 flex items-center justify-center">
        <div class="bg-white p-8 md:p-12 rounded-xl shadow-lg w-full max-w-lg text-center">
            
            <h2 class="text-4xl font-bold text-green-600 mb-4">FIM DE JOGO!</h2>
            
            <p class="text-lg text-gray-700 mb-8">Parabéns, <span id="user-name" class="font-semibold">Jogador</span>!</p>
            
            <div class="space-y-3 text-left max-w-xs mx-auto text-lg text-gray-800 mb-10">
                <div class="flex justify-between border-b pb-2">
                    <strong>Sua pontuação final:</strong>
                    <span id="final-score" class="font-bold text-blue-600">0</span>
                </div>
                <div class="flex justify-between border-b pb-2">
                    <strong>Seu tempo foi:</strong>
                    <span id="final-time" class="font-bold">0 segundos</span>
                </div>
                <div class="flex justify-between">
                    <strong>Dificuldade:</strong>
                    <span id="final-difficulty" class="font-bold capitalize">N/A</span>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <a id="btn-play-again" href="#" class="w-full sm:w-auto px-6 py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition-colors">
                    Jogar Novamente
                </a>
                <a id="btn-exit" href="#" class="w-full sm:w-auto px-6 py-3 bg-gray-500 text-white font-bold rounded-lg hover:bg-gray-600 transition-colors">
                    Sair
                </a>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/site/header.js"></script> <script src="../assets/js/site/footer.js"></script> <script src="../assets/js/page/endgame.js"></script>
</body>
</html>
