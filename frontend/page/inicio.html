<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit Memory Game - Início</title>
    <script src="../assets/css/cdn/tailwindcss/3.4.17.js"></script>
    <link rel="stylesheet" href="../assets/css/background.css">
    <style type="text/tailwindcss">
        /* Novo estilo, mais minimalista e elegante */
        .btn-difficulty {
            @apply w-full max-w-xs px-6 py-3 text-lg font-semibold tracking-widest text-gray-300; /* Texto cinza claro, mais espaçado */
            @apply transition-all duration-300 ease-in-out;
            
            /* Efeitos ao passar o mouse */
            @apply hover:text-white hover:scale-110; /* Texto fica branco e aumenta de tamanho */
        }
    </style>
</head>
<body class="background flex flex-col min-h-screen">

    <div id="header-placeholder"></div>

    <main class="flex-grow container mx-auto p-4 flex items-center justify-center">

        <div id="welcome-view" class="bg-white p-8 md:p-12 rounded-xl shadow-lg w-full max-w-3xl text-center">
            
            <img src="../assets/image/site/Fit2025_logo.jpeg" alt="Logo FIT" class="h-20 w-20 rounded-full mx-auto mb-6 bg-gray-900 p-1 border-2 border-gray-300">
            
            <h2 class="text-3xl font-bold text-gray-800 mb-2">FIT MEMORY GAME!</h2>
            
            <p class="text-gray-600 max-w-lg mx-auto mb-6">
                Devido sua aprovação no evento anterior, o <strong>Fórum de Inovação e Tecnologia</strong> apresenta a todos vocês a versão 2.0 do nosso amado jogo da memória! Boa sorte!
            </p>

            <p class="text-lg font-semibold text-blue-600 tracking-wider mb-6">
                QUE COMECEM OS JOGOS...
            </p>

            <button id="start-game-button" class="w-full max-w-xs bg-blue-600 text-white font-bold py-3 px-6 rounded-lg text-lg hover:bg-blue-700 transition-colors duration-300 shadow-md mb-6">
                Iniciar o jogo!
            </button>

            <div class="flex flex-col sm:flex-row justify-center gap-4 mt-4">
                <a href="/page/ranking.html" class="flex items-center justify-center gap-2 py-3 px-6 bg-gray-100 text-gray-700 font-semibold rounded-lg hover:bg-gray-200 transition-colors w-full sm:w-auto">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    RANKING GERAL
                </a>
                <a href="/page/history.html" class="flex items-center justify-center gap-2 py-3 px-6 bg-gray-100 text-gray-700 font-semibold rounded-lg hover:bg-gray-200 transition-colors w-full sm:w-auto">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    MEU HISTÓRICO
                </a>
            </div>

        </div>

        <div id="difficulty-view" class="bg-gray-900 text-white p-8 md:p-12 rounded-xl shadow-lg w-full max-w-xl text-center">
            
            <h2 class="text-3xl font-bold tracking-widest mb-10">
                ESCOLHA A DIFICULDADE
            </h2>

            <div class="flex flex-col items-center gap-6">
                <button id="btn-intermediario" class="btn-difficulty">
                    INTERMEDIÁRIO
                </button>
                <button id="btn-dificil" class="btn-difficulty">
                    DIFÍCIL
                </button>
            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/site/header.js"></script>
    <script src="../assets/js/site/footer.js"></script>
    <script src="../assets/js/page/inicio.js"></script>

</body>
</html>
