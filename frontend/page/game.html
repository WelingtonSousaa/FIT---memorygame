<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit Memory Game - Jogando</title>
    <script src="../assets/css/cdn/tailwindcss/3.4.17.js"></script>
    <link rel="stylesheet" href="../assets/css/background.css">
    <link rel="stylesheet" href="../assets/css/game.css">
</head>
<body class="background flex flex-col min-h-screen">

    <div id="header-placeholder"></div>

    <main class="flex-grow container mx-auto p-4">
        <div class="flex flex-col lg:flex-row gap-6">

            <div class="w-full lg:w-3/4">
                <div class="bg-white p-4 rounded-xl shadow-lg"> 
                    <div class="flex justify-between items-center mb-4 px-4">
                        <div class="text-lg">
                            <strong>Tempo: </strong><span id="time-counter">0s</span>
                        </div>
                        <div class="text-lg">
                            <strong>Pontuação: </strong><span id="score-counter">0</span>
                        </div>
                    </div>

                    <div class="game-board mb-4">
                        </div>

                    <div class="flex justify-center gap-4">
                        
                        <button id="btn-abandon" class="px-6 py-2 bg-gray-500 text-white font-bold rounded-lg hover:bg-gray-600 transition-colors">
                            Abandonar
                        </button>
                        
                        <button id="btn-restart" class="px-6 py-2 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition-colors">
                            Recomeçar
                        </button>
                    </div>
                </div>
            </div>

            <div class="w-full lg:w-1/4">
                <div class="bg-white p-4 rounded-xl shadow-lg h-full flex flex-col">
                    <h3 class="text-center font-bold text-lg text-gray-700 mb-4 border-b pb-2">
                        HISTÓRICO
                    </h3>
                    <div id="history-log">
                        </div>
                </div>
            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/site/header.js"></script>
    <script src="../assets/js/site/footer.js"></script>
    <script src="../assets/js/page/game.js"></script>
</body>
</html>
